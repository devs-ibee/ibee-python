# The SDKs fill these from client config (workspace id) and with a random key
# (idempotency: X-Idempotency-Key, and Container Registry's Idempotency-Key on plan
# upgrade), so they are optional in the generated request types.
components:
  parameters:
    WorkspaceId:
      required: false
    IdempotencyKey:
      required: false
    ContainerRegistryIdempotencyKey:
      required: false

# Backups disable: the service needs a JSON body and answers 422 without one, but contract
# 0.6.2 declares none (platform-docs gap G3). With this body the generated method takes
# `request` and sends it; pass `request={}`. Remove once the contract declares the body.
paths:
  /compute/cloud-vms/{vm_id}/backups/disable:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      x-fern-examples:
        - path-parameters:
            vm_id: vm_id
          query-parameters:
            workspace_id: "710995"
          request: {}
  /compute/gpu-vms/{vm_id}/backups/disable:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      x-fern-examples:
        - path-parameters:
            vm_id: vm_id
          query-parameters:
            workspace_id: "710995"
          request: {}
